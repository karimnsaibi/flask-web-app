services:
  db:
    image: postgres:17
    container_name: tt_network_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tt_network}
      POSTGRES_USER: ${POSTGRES_USER:-tt_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tt_app}
    ports:
      - "5432:5432"
    volumes:
      - tt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tt_app} -d ${POSTGRES_DB:-tt_network}"]
      interval: 5s
      retries: 10

volumes:
  tt_pgdata:
